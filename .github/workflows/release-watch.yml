name: release-watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check npm dist-tags and generate report on change
        run: node scripts/watch-release.mjs | tee /tmp/watch.out
      - name: Commit and push if the release train moved
        run: |
          if grep -q 'CHANGED' /tmp/watch.out; then
            git config user.name "zoahdev"
            git config user.email "245318860+zoahdev@users.noreply.github.com"
            git add docs/release-compat
            git commit -m "docs: release compatibility report (train moved)"
            git push
          else
            echo "no release train change"
          fi
